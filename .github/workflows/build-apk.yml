name: Compilar APK Android (DGREC)

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch: # Permite compilar manualmente con un clic en GitHub Actions

jobs:
  build:
    name: Build APK con Capacitor
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3

      - name: Instalar dependencias del proyecto
        run: npm ci || npm install

      - name: Sincronizar proyecto Android con Capacitor
        run: npx cap sync android

      - name: Otorgar permisos de ejecución a Gradle
        run: chmod +x android/gradlew

      - name: Compilar APK (Debug)
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon

      - name: Subir APK como artefacto descargable
        uses: actions/upload-artifact@v4
        with:
          name: DGREC-Sistema-Registral-APK
          path: android/app/build/outputs/apk/debug/*.apk
          retention-days: 14
