<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>DD-DGRE-REC</title>
  <link rel="manifest" href="manifest.json">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background-color: #040810;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 24px;
      text-align: center;
    }
    .logo-container {
      width: 130px;
      height: 130px;
      border-radius: 28px;
      background: #ffffff;
      padding: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 24px;
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.5), 0 0 40px rgba(5, 150, 105, 0.2);
    }
    .logo-container img {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }
    h1 {
      font-size: 26px;
      font-weight: 900;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      margin-bottom: 8px;
      color: #ffffff;
    }
    p {
      color: #94a3b8;
      font-size: 13px;
      max-width: 320px;
      line-height: 1.5;
      margin-bottom: 28px;
    }
    .loader {
      width: 40px;
      height: 40px;
      border: 3.5px solid rgba(255,255,255,0.12);
      border-top-color: #10b981;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div class="logo-container">
    <img src="logo1.png" alt="DD-DGRE-REC" />
  </div>
  <h1>DD-DGRE-REC</h1>
  <p>Iniciando módulo de digitalización de libros de defunciones...</p>
  <div class="loader"></div>

  <script>
    setTimeout(function() {
      window.location.href = 'https://dgre-tsje.web.app/escaneo-libro';
    }, 400);
  </script>
</body>
</html>
