<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>DGREC - Sistema Registral</title>
  <link rel="manifest" href="manifest.json">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background-color: #040810;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 24px;
      text-align: center;
    }
    .logo-box {
      width: 80px;
      height: 80px;
      border-radius: 20px;
      background: linear-gradient(135deg, #059669, #047857);
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 24px;
      box-shadow: 0 10px 25px rgba(5, 150, 105, 0.3);
    }
    .logo-box svg {
      width: 44px;
      height: 44px;
      stroke: #ffffff;
      fill: none;
      stroke-width: 2;
    }
    h1 {
      font-size: 22px;
      font-weight: 900;
      letter-spacing: -0.5px;
      text-transform: uppercase;
      margin-bottom: 8px;
    }
    p {
      color: #94a3b8;
      font-size: 13px;
      max-width: 300px;
      line-height: 1.5;
      margin-bottom: 24px;
    }
    .loader {
      width: 36px;
      height: 36px;
      border: 3px solid rgba(255,255,255,0.1);
      border-top-color: #10b981;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div class="logo-box">
    <svg viewBox="0 0 24 24">
      <path d="M4 19.5v-15A2.5 2.5 0 0 1 6.5 2H20v20H6.5a2.5 2.5 0 0 1-2.5-2.5Z"></path>
      <path d="M6 6h10"></path>
      <path d="M6 10h10"></path>
    </svg>
  </div>
  <h1>DGREC Registral</h1>
  <p>Cargando módulo de digitalización de libros y defunciones...</p>
  <div class="loader"></div>

  <script>
    // Redirige al módulo de escaneo de libros
    window.location.replace('/escaneo-libro');
  </script>
</body>
</html>
